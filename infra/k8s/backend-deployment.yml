apiVersion: apps/v1
kind: Deployment
metadata:
  name: sansi-backend
  labels:
    app: sansi
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sansi
      tier: backend
  template:
    metadata:
      labels:
        app: sansi
        tier: backend
    spec:
      containers:
        - name: backend
          image: sansi/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sansi-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: sansi-secrets
                  key: secret-key
            - name: REDIS_URL
              value: "redis://sansi-redis:6379/0"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sansi-backend
spec:
  selector:
    app: sansi
    tier: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
