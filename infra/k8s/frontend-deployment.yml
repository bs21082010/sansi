apiVersion: apps/v1
kind: Deployment
metadata:
  name: sansi-frontend
  labels:
    app: sansi
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sansi
      tier: frontend
  template:
    metadata:
      labels:
        app: sansi
        tier: frontend
    spec:
      containers:
        - name: frontend
          image: sansi/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://sansi.app/api/v1"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sansi-frontend
spec:
  selector:
    app: sansi
    tier: frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
