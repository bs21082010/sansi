version: "3.9"

services:
  nginx:
    build: ./infra/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
      - ai
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - db
      - ai
      - redis
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1

  ai:
    build: ./ai
    volumes:
      - ./ai:/app
      - model-cache:/root/.cache

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sansi
      POSTGRES_USER: sansi
      POSTGRES_PASSWORD: sansi_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  pgdata:
  model-cache:
  redis-data:
