name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: sansi/backend
  FRONTEND_IMAGE: sansi/frontend
  AI_IMAGE: sansi/ai

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "backend" ]; then
            pip install -r requirements.txt
            python -c "import app; print('Backend imports OK')"
          else
            npm ci
            npm run lint
            npm run build
          fi

  docker:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, ai]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service == 'backend' && env.BACKEND_IMAGE || (matrix.service == 'frontend' && env.FRONTEND_IMAGE || env.AI_IMAGE) }}:latest
            ${{ env.REGISTRY }}/${{ matrix.service == 'backend' && env.BACKEND_IMAGE || (matrix.service == 'frontend' && env.FRONTEND_IMAGE || env.AI_IMAGE) }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
